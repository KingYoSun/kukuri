[package]
name = "kukuri-desktop-tauri"
version = "0.1.8"
edition = "2024"
default-run = "kukuri-desktop-tauri"

[lib]
name = "kukuri_desktop_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
anyhow = "1.0.104"
kukuri-app-api = { path = "../../../crates/app-api" }
kukuri-core = { path = "../../../crates/core" }
kukuri-desktop-runtime = { path = "../../../crates/desktop-runtime" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2.11.5", features = ["tray-icon"] }
tauri-plugin-deep-link = "2.4.9"
tauri-plugin-dialog = "2.7.3"
tauri-plugin-single-instance = { version = "2.4.3", features = ["deep-link"] }
tauri-plugin-updater = "2.10.1"
tokio = { version = "1", features = ["time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.8"

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
notify-rust = "4"

[dev-dependencies]
base64 = "0.23"
minisign-verify = "0.2"

[patch.crates-io]
netwatch = { git = "https://github.com/n0-computer/net-tools", rev = "e9afb4dda300dda06193b5046ba7a05e5d176e22" }
