[package]
name = "kukuri-desktop-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
base64.workspace = true
blake3.workspace = true
chrono.workspace = true
image.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
url.workspace = true
kukuri-app-api = { path = "../app-api" }
kukuri-blob-service = { path = "../blob-service" }
kukuri-cn-protocol = { path = "../cn-protocol" }
kukuri-core = { path = "../core" }
kukuri-docs-sync = { path = "../docs-sync" }
kukuri-iroh-node = { path = "../iroh-node" }
kukuri-store = { path = "../store" }
kukuri-transport = { path = "../transport" }
ts-rs = { workspace = true, optional = true }

[features]
# IPC 型の TypeScript 生成専用(codegen 時のみ有効。生成器はこの crate に置く
# — client 依存グラフの頂点で全 IPC 型に到達できるため)。
ts = [
  "dep:ts-rs",
  "kukuri-app-api/ts",
  "kukuri-core/ts",
  "kukuri-store/ts",
  "kukuri-transport/ts",
  "kukuri-cn-protocol/ts",
]

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { workspace = true, features = ["sync-secret-service"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { workspace = true, features = ["windows-native"] }

[dev-dependencies]
axum.workspace = true
tempfile.workspace = true
futures-util.workspace = true
iroh-mainline-address-lookup.workspace = true
n0-mainline.workspace = true
iroh = { workspace = true, features = ["test-utils"] }
kukuri-cn-iroh-relay = { path = "../cn-iroh-relay" }
# WP-S3 T6: manifest round-trip contract テスト(server 実出力 -> slim 型)のため。
kukuri-cn-operator = { path = "../cn-operator" }

[lints]
workspace = true
