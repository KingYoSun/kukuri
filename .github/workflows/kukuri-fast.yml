name: Kukuri Fast

on:
  pull_request:
    paths:
      - '.config/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.cargo/**'
      - 'xtask/**'
      - 'crates/**'
      - 'apps/**'
      - 'harness/**'
      - '.github/workflows/kukuri-fast.yml'
      - '.github/workflows/kukuri-nightly.yml'
      - '.github/workflows/kukuri-release.yml'
  push:
    branches: [main, develop]
    paths:
      - '.config/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.cargo/**'
      - 'xtask/**'
      - 'crates/**'
      - 'apps/**'
      - 'harness/**'
      - '.github/workflows/kukuri-fast.yml'
      - '.github/workflows/kukuri-nightly.yml'
      - '.github/workflows/kukuri-release.yml'
  workflow_dispatch:

# #1117: 同じ PR に続けて push したときは古い head の run を取り消し、Namespace の
# 同時実行枠を空ける。push / workflow_dispatch は run ごとに別 group にして取り消さない。
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # #1120: CI の dev / test build は行番号だけの debuginfo にし、link 時間と Cache Volume の容量を減らす。
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

# #1120: cache-tag の `-v2` は、debuginfo を line-tables-only にする前の依存 crate の成果物を含む
# 旧 volume を捨てるために付けた。依存の build 設定を大きく変えたときは同じ方法で入れ替える。
jobs:
  linux-rust-static:
    runs-on: namespace-profile-kukuri;overrides.cache-tag=kukuri-rust-static-v2
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.92
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0
          components: clippy,rustfmt

      - name: Install Linux system dependencies
        run: >
          sudo apt-get update &&
          sudo apt-get install -y
          pkg-config
          libdbus-1-dev
          libglib2.0-dev
          libgtk-3-dev
          libwebkit2gtk-4.1-dev
          libayatana-appindicator3-dev
          librsvg2-dev
          patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache Rust
        uses: namespacelabs/nscloud-cache-action@v1
        with:
          cache: rust

      - name: Doctor
        run: cargo xtask-lite doctor

      - name: Oversized file report
        run: cargo xtask-lite oversized-files

      - name: Asset rights manifest
        run: cargo xtask-lite asset-check

      - name: Rust checks
        run: cargo xtask-lite rust-check

      - name: IPC types are in sync (Rust -> types.generated.ts)
        run: cargo xtask-lite ipc-types --check

      - name: Tauri compile check
        run: cargo xtask-lite tauri-check

      # #1120: workspace crate の成果物は checkout ごとに再 compile されるため、Cache Volume に残さない。
      - name: Prune workspace build artifacts
        run: cargo xtask-lite ci-prune-target

  linux-rust-tests:
    runs-on: namespace-profile-kukuri;overrides.cache-tag=kukuri-rust-tests-v2
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.92
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0

      - name: Install Linux system dependencies
        run: >
          sudo apt-get update &&
          sudo apt-get install -y
          pkg-config
          libdbus-1-dev
          libglib2.0-dev
          libgtk-3-dev
          libwebkit2gtk-4.1-dev
          libayatana-appindicator3-dev
          librsvg2-dev
          patchelf

      - name: Cache Rust
        uses: namespacelabs/nscloud-cache-action@v1
        with:
          cache: rust

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: Rust tests
        run: cargo xtask-lite rust-test

      # #1120: workspace crate の成果物は checkout ごとに再 compile されるため、Cache Volume に残さない。
      - name: Prune workspace build artifacts
        run: cargo xtask-lite ci-prune-target

  linux-desktop-ui:
    runs-on: namespace-profile-kukuri-4v;overrides.cache-tag=kukuri-desktop
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.92
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0

      - name: Install Linux system dependencies
        run: >
          sudo apt-get update &&
          sudo apt-get install -y
          pkg-config
          libdbus-1-dev
          libglib2.0-dev
          libgtk-3-dev
          libwebkit2gtk-4.1-dev
          libayatana-appindicator3-dev
          librsvg2-dev
          patchelf

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.16.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Cache Rust
        uses: namespacelabs/nscloud-cache-action@v1
        with:
          cache: rust

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      - name: Desktop lint + typecheck
        run: cargo xtask-lite desktop-lint

      - name: Desktop Vitest
        run: cargo xtask-lite desktop-test

      # #1120: workspace crate の成果物は checkout ごとに再 compile されるため、Cache Volume に残さない。
      - name: Prune workspace build artifacts
        run: cargo xtask-lite ci-prune-target

  linux-desktop-browser:
    # #1121: Playwright は CPU を使い切るため、4 vCPU では worker を増やしても速くならず
    # metaverse の 3D test が timeout で落ちた。8 vCPU に戻すと既定で 4 worker になり、
    # 1 run あたりの vCPU × 分はほぼ同じまま所要時間が半分になる。cache-tag は据え置き。
    runs-on: namespace-profile-kukuri;overrides.cache-tag=kukuri-desktop
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.92
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0

      - name: Install Linux system dependencies
        run: >
          sudo apt-get update &&
          sudo apt-get install -y
          pkg-config
          libdbus-1-dev
          libglib2.0-dev
          libgtk-3-dev
          libwebkit2gtk-4.1-dev
          libayatana-appindicator3-dev
          librsvg2-dev
          patchelf
          fonts-noto-cjk

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.16.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Cache Rust
        uses: namespacelabs/nscloud-cache-action@v1
        with:
          cache: rust

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        working-directory: apps/desktop
        run: pnpm exec playwright install chromium

      - name: Desktop Storybook build
        run: cargo xtask-lite desktop-storybook

      - name: Desktop browser tests
        run: cargo xtask-lite desktop-browser-test

      - name: Desktop visual regression tests
        run: cargo xtask-lite desktop-visual-test

      - name: Upload visual regression diff
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kukuri-desktop-visual-diff
          path: apps/desktop/test-results/
          if-no-files-found: ignore

      # #1120: workspace crate の成果物は checkout ごとに再 compile されるため、Cache Volume に残さない。
      - name: Prune workspace build artifacts
        run: cargo xtask-lite ci-prune-target

  linux-cn:
    runs-on: namespace-profile-kukuri;overrides.cache-tag=kukuri-cn-v2
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.92
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0

      - name: Install Linux system dependencies
        run: >
          sudo apt-get update &&
          sudo apt-get install -y
          pkg-config
          ffmpeg
          libdbus-1-dev
          libglib2.0-dev
          libgtk-3-dev
          libwebkit2gtk-4.1-dev
          libayatana-appindicator3-dev
          librsvg2-dev
          patchelf

      - name: Cache Rust
        uses: namespacelabs/nscloud-cache-action@v1
        with:
          cache: rust

      - name: Community-node checks
        run: cargo xtask-lite cn-check

      - name: Community-node integration tests
        run: cargo xtask-lite cn-test

      # #1120: workspace crate の成果物は checkout ごとに再 compile されるため、Cache Volume に残さない。
      - name: Prune workspace build artifacts
        run: cargo xtask-lite ci-prune-target

  linux-cn-e2e:
    runs-on: namespace-profile-kukuri;overrides.cache-tag=kukuri-cn-e2e-v2
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.92
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0

      - name: Install Linux system dependencies
        run: >
          sudo apt-get update &&
          sudo apt-get install -y
          pkg-config
          libdbus-1-dev
          libglib2.0-dev
          libgtk-3-dev
          libwebkit2gtk-4.1-dev
          libayatana-appindicator3-dev
          librsvg2-dev
          patchelf

      - name: Cache Rust
        uses: namespacelabs/nscloud-cache-action@v1
        with:
          cache: rust

      - name: Community-node full-stack E2E
        run: cargo xtask-lite cn-e2e

      # #1120: workspace crate の成果物は checkout ごとに再 compile されるため、Cache Volume に残さない。
      - name: Prune workspace build artifacts
        run: cargo xtask-lite ci-prune-target

  linux-smoke:
    runs-on: namespace-profile-kukuri-4v;overrides.cache-tag=kukuri-harness-v2
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.92
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0

      - name: Install Linux system dependencies
        run: >
          sudo apt-get update &&
          sudo apt-get install -y
          pkg-config
          libdbus-1-dev
          libglib2.0-dev
          libgtk-3-dev
          libwebkit2gtk-4.1-dev
          libayatana-appindicator3-dev
          librsvg2-dev
          patchelf

      - name: Cache Rust
        uses: namespacelabs/nscloud-cache-action@v1
        with:
          cache: rust

      - name: E2E smoke
        run: cargo xtask e2e-smoke

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kukuri-fast-smoke-artifacts
          path: test-results/kukuri/
          if-no-files-found: warn

      # #1120: workspace crate の成果物は checkout ごとに再 compile されるため、Cache Volume に残さない。
      - name: Prune workspace build artifacts
        run: cargo xtask ci-prune-target

  linux-community-node:
    runs-on: namespace-profile-kukuri-4v;overrides.cache-tag=kukuri-harness-v2
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.92
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0

      - name: Install Linux system dependencies
        run: >
          sudo apt-get update &&
          sudo apt-get install -y
          pkg-config
          libdbus-1-dev
          libglib2.0-dev
          libgtk-3-dev
          libwebkit2gtk-4.1-dev
          libayatana-appindicator3-dev
          librsvg2-dev
          patchelf

      - name: Cache Rust
        uses: namespacelabs/nscloud-cache-action@v1
        with:
          cache: rust

      - name: Community-node connectivity scenario
        env:
          CN_POSTGRES_PORT: "55433"
          COMMUNITY_NODE_DATABASE_URL: postgres://cn:cn_password@127.0.0.1:55433/cn
        run: cargo xtask scenario community_node_public_connectivity

      - name: Community-node index client scenario
        env:
          KUKURI_DISABLE_KEYRING: "1"
        run: |
          cargo xtask scenario community_node_index_query_client
          cargo xtask scenario community_node_report_routing
          cargo xtask scenario community_node_trust_relation_client

      - name: Upload community-node artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kukuri-fast-community-node-artifacts
          path: test-results/kukuri/
          if-no-files-found: warn

      # #1120: workspace crate の成果物は checkout ごとに再 compile されるため、Cache Volume に残さない。
      - name: Prune workspace build artifacts
        run: cargo xtask ci-prune-target

  windows-fast:
    runs-on: namespace-profile-kukuri-win;overrides.cache-tag=kukuri-windows-v2
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.92
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0
          components: clippy,rustfmt

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.16.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      # #1073: Windows profile も Cache Volume を使う（Windows では junction で mount される）。
      # `cache: rust` は Cargo registry / git と root の target を扱う。配布物を build する
      # src-tauri 側の target は別 directory なので path で明示する。
      - name: Cache Rust
        uses: namespacelabs/nscloud-cache-action@v1
        with:
          cache: rust
          path: |
            ${{ github.workspace }}/apps/desktop/src-tauri/target

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      - name: Doctor
        run: cargo xtask doctor

      - name: Oversized file report
        run: cargo xtask oversized-files

      - name: Windows Tauri compile check
        timeout-minutes: 20
        run: cargo xtask tauri-check

      - name: E2E smoke
        timeout-minutes: 15
        run: cargo xtask e2e-smoke

      - name: Windows package
        # #1063: cache なしの実測 23〜25 分に対し、70% が 31.5 分となる値。
        timeout-minutes: 45
        run: cargo xtask desktop-package

      - name: Upload kukuri artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kukuri-windows-fast-artifacts
          path: test-results/kukuri/
          if-no-files-found: warn

      - name: Upload NSIS installer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kukuri-windows-nsis
          path: apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/
          if-no-files-found: warn

      # #1120: workspace crate の成果物は checkout ごとに再 compile されるため、Cache Volume に残さない。
      - name: Prune workspace build artifacts
        run: cargo xtask ci-prune-target
