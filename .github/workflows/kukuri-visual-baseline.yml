name: Kukuri Visual Baseline

# 視覚回帰 baseline（Linux/Chromium）を生成し artifact として吐き出す（WP-S7 T1）。
# CI 環境では process.env.CI が自動設定され playwright.config の ignoreSnapshots が false に
# なるため、--update-snapshots で __screenshots__/ を生成できる。手動 dispatch 専用。
# kukuri-fast.yml の必須ジョブには一切手を入れない（step 追加は T2）。
on:
  workflow_dispatch:

jobs:
  generate-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      changed: ${{ steps.changed.outputs.list }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        run: >
          sudo apt-get update &&
          sudo apt-get install -y
          pkg-config
          libdbus-1-dev
          libglib2.0-dev
          libgtk-3-dev
          libwebkit2gtk-4.1-dev
          libayatana-appindicator3-dev
          librsvg2-dev
          patchelf
          fonts-noto-cjk

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.16.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        working-directory: apps/desktop
        run: pnpm exec playwright install chromium

      - name: Generate visual baseline
        working-directory: apps/desktop
        run: pnpm test:e2e:visual --update-snapshots

      # TEMPORARY (#964, branch-only, reverted before merge): the session driving PR #980
      # cannot download artifacts, so list the changed baselines for the dump job below.
      - name: List changed baselines
        id: changed
        run: |
          cd apps/desktop/tests/playwright/__screenshots__/visual.spec.ts
          list=$(git status --porcelain . | awk '{print $2}' | xargs -n1 basename | jq -R . | jq -sc .)
          echo "changed=$list"
          echo "list=$list" >> "$GITHUB_OUTPUT"

      - name: Upload visual baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kukuri-desktop-visual-baseline
          path: apps/desktop/tests/playwright/__screenshots__/
          if-no-files-found: warn

  # TEMPORARY (#964, branch-only, reverted before merge): one job per changed PNG so each
  # job log stays small enough to read back and decode.
  dump-baseline:
    needs: generate-baseline
    if: ${{ needs.generate-baseline.outputs.changed != '[]' && needs.generate-baseline.outputs.changed != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        file: ${{ fromJSON(needs.generate-baseline.outputs.changed) }}
    steps:
      - name: Download visual baseline
        uses: actions/download-artifact@v4
        with:
          name: kukuri-desktop-visual-baseline
          path: shots

      - name: Dump ${{ matrix.file }} as base64
        run: |
          f="shots/visual.spec.ts/${{ matrix.file }}"
          echo "BEGIN_PNG ${{ matrix.file }}"
          base64 -w 76 "$f"
          echo "END_PNG ${{ matrix.file }}"
