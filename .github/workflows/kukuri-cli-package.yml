name: Kukuri CLI Package

on:
  pull_request:
    paths:
      - '.github/workflows/kukuri-cli-package.yml'
      - '.github/workflows/kukuri-release.yml'
      - 'scripts/release/cli_archive.py'
      - 'scripts/release/release_assets.py'
      - 'scripts/release/test_cli_archive.py'
      - 'scripts/release/test_release_assets.py'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
  workflow_call:
    inputs:
      source_ref:
        type: string
        required: true
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cli-package:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0
          targets: ${{ matrix.arch }}-unknown-linux-gnu
      - name: Build and emulation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config gcc-aarch64-linux-gnu g++-aarch64-linux-gnu qemu-user
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: kukuri-cli-package-${{ matrix.arch }}
      - name: Package contracts
        run: |
          python3 scripts/release/test_release_assets.py
          python3 scripts/release/test_cli_archive.py
      - name: Build, package and smoke actual archive
        env:
          ARCH: ${{ matrix.arch }}
          REQUESTED_SOURCE: ${{ inputs.source_ref }}
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar
        run: |
          set -euo pipefail
          source=$(git rev-parse HEAD)
          if [ -n "$REQUESTED_SOURCE" ]; then
            [[ "$REQUESTED_SOURCE" =~ ^[0-9a-f]{40}$ ]] && test "$source" = "$REQUESTED_SOURCE"
          fi
          version=$(cargo metadata --locked --no-deps --format-version 1 | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "kukuri-cli"))')
          target="$ARCH-unknown-linux-gnu"
          cargo build --locked --release -p kukuri-cli --target "$target"
          python3 scripts/release/cli_archive.py package --arch "$ARCH" --version "$version" \
            --source "$source" --binary "target/$target/release/kukuri-cli" --output "dist/cli-$ARCH"
          archive="$PWD/dist/cli-$ARCH/kukuri-cli_${version}_${target}.tar.gz"
          if [ "$ARCH" = aarch64 ]; then
            python3 scripts/release/cli_archive.py smoke --arch "$ARCH" --version "$version" \
              --archive "$archive" --runner qemu-aarch64 -L /usr/aarch64-linux-gnu
          else
            python3 scripts/release/cli_archive.py smoke --arch "$ARCH" --version "$version" --archive "$archive"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: kukuri-cli-linux-${{ matrix.arch }}
          if-no-files-found: error
          path: dist/cli-${{ matrix.arch }}/
