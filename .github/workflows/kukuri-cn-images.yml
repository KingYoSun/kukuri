name: Kukuri Community Node Images

on:
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'docker/cn/Dockerfile'
      - 'crates/cn-*/**'
      - '.github/workflows/kukuri-cn-images.yml'
  push:
    branches: [main, develop]
    tags:
      - 'v*'
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'docker/cn/Dockerfile'
      - 'crates/cn-*/**'
      - '.github/workflows/kukuri-cn-images.yml'
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Tag to publish to GHCR (example: latest, v0.1.2-cn.1, 2026-06-28)'
        required: false
        default: 'latest'
        type: string
      push:
        description: 'Push images to GHCR'
        required: false
        default: true
        type: boolean

# #1117: 同じ PR に続けて push したときは古い head の run を取り消し、Namespace の
# 同時実行枠を空ける。push / workflow_dispatch は run ごとに別 group にして取り消さない。
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build community node images
    # #1117: 専用 profile（同時 runner 1）で動かし、Kukuri Fast の同時実行枠を食い尽くさない。
    # cargo の Cache Volume は使わないので cache-tag は付けない。
    runs-on: namespace-profile-kukuri-cn-images
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # #1122: 4 image 分の tag を先に決める。push は smoke の後にだけ行う。
      - name: Prepare image metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          short_sha="${GITHUB_SHA::12}"
          push="false"
          extra_tag=""

          case "${GITHUB_EVENT_NAME}" in
            workflow_dispatch)
              if [[ "${{ github.event.inputs.push }}" == "true" ]]; then
                push="true"
              fi
              extra_tag="${{ github.event.inputs.image_tag }}"
              ;;
            push)
              push="true"
              if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
                extra_tag="${GITHUB_REF_NAME}"
              elif [[ "${GITHUB_REF_NAME}" == "main" ]]; then
                extra_tag="latest"
              else
                extra_tag="${GITHUB_REF_NAME//\//-}"
              fi
              ;;
          esac

          mkdir -p "${RUNNER_TEMP}/cn-image-tags"
          for image in kukuri-cn-user-api kukuri-cn-iroh-relay kukuri-cn-cli kukuri-cn-indexer; do
            ref="${REGISTRY}/${owner}/${image}"
            if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
              printf '%s\n' "${ref}:pr-${{ github.event.pull_request.number }}-${short_sha}" \
                > "${RUNNER_TEMP}/cn-image-tags/${image}"
            else
              printf '%s\n' "${ref}:sha-${short_sha}" > "${RUNNER_TEMP}/cn-image-tags/${image}"
              if [[ -n "$extra_tag" ]]; then
                printf '%s\n' "${ref}:${extra_tag}" >> "${RUNNER_TEMP}/cn-image-tags/${image}"
              fi
            fi
          done

          {
            echo "owner=${owner}"
            echo "push=${push}"
          } >> "$GITHUB_OUTPUT"
          echo 'Tags:'
          for image in kukuri-cn-user-api kukuri-cn-iroh-relay kukuri-cn-cli kukuri-cn-indexer; do
            sed "s/^/  ${image}: /" "${RUNNER_TEMP}/cn-image-tags/${image}"
          done

      # #1122: 4 image を 1 回の build session で作る。builder stage を共有するので
      # 共通の依存 crate の compile は 1 回だけになる。ここでは registry へ出さず、
      # OCI layout（と smoke 用の docker archive）へ書き出す。
      - name: Build images
        env:
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
          REVISION: ${{ github.sha }}
          OUT_DIR: ${{ runner.temp }}/cn-images-out
        run: |
          set -euo pipefail
          docker buildx version
          mkdir -p "${OUT_DIR}"
          # context の外へ書き出すため、書き込み先を明示して許可する（buildx の filesystem entitlement）。
          docker buildx bake --file docker/cn/docker-bake.hcl --progress plain --allow "fs.write=${OUT_DIR}"

      - name: Load cn-indexer image for smoke
        shell: bash
        run: |
          set -euo pipefail
          docker load --input "${RUNNER_TEMP}/cn-images-out/kukuri-cn-indexer-smoke.tar"
          docker image inspect cn-indexer-smoke:local --format 'loaded {{.Id}}'

      # cn-indexer は publish 前に production 契約を image smoke で固定する（#614）:
      # mock / unknown provider の fail-closed 拒否、slot 制約、credential env 欠落の明示的
      # 失敗、credential 値の非漏出、正常構成の exit 0。`validate-config` は外部接続なしの
      # 起動前検証モードなので、secret 実値や DB を要しない。#1122 以降、この step は production
      # target と同じ stage・同じ build args から作った image に対して実行し、通ってから push する。
      - name: Smoke test cn-indexer image
        shell: bash
        run: |
          set -euo pipefail
          image="cn-indexer-smoke:local"
          # secret 実値は使わない。SENTINEL はダミー credential の漏出検知マーカー。
          base_args=(
            --rm
            -e COMMUNITY_NODE_DATABASE_URL=postgres://smoke.invalid/cn
            -e COMMUNITY_NODE_CHANNEL_SECRET_KEY=image-smoke-channel-secret-key-0123456789abcdef
            -e COMMUNITY_NODE_INDEXER_EXTERNAL_RELAY_URLS=https://relay.example.net
          )
          leak_log=""

          run_case() {
            local name="$1" expected="$2" pattern="$3"
            shift 3
            local out status
            set +e
            out=$(docker run "${base_args[@]}" "$@" "$image" validate-config 2>&1)
            status=$?
            set -e
            leak_log+="$out"$'\n'
            if [[ "$expected" == "ok" && "$status" -ne 0 ]]; then
              echo "::error::smoke case '$name' expected exit 0 but got $status"
              echo "$out"
              exit 1
            fi
            if [[ "$expected" == "fail" && "$status" -eq 0 ]]; then
              echo "::error::smoke case '$name' expected a startup failure but got exit 0"
              echo "$out"
              exit 1
            fi
            if [[ -n "$pattern" ]] && ! grep -qF "$pattern" <<<"$out"; then
              echo "::error::smoke case '$name' output does not contain: $pattern"
              echo "$out"
              exit 1
            fi
            echo "smoke case '$name': ok"
          }

          # 正常系: provider 未構成は ingest 無効で常駐する正規の fail-closed 状態。
          run_case "provider-less config" ok "cn-indexer configuration is valid"

          # 正常系: production provider 構成（ダミー credential で構成検証のみ）。
          run_case "production providers" ok "cn-indexer configuration is valid" \
            -e COMMUNITY_NODE_SAFETY_PROVIDER_KNOWN_CSAM=project-arachnid-shield \
            -e COMMUNITY_NODE_SAFETY_PROVIDER_GENERAL=openai-compatible-vlm \
            -e COMMUNITY_NODE_SAFETY_PROVIDER_UNKNOWN_CSAM=openai-compatible-vlm \
            -e PROJECT_ARACHNID_API_USERNAME=dummy-arachnid-user-SENTINEL \
            -e PROJECT_ARACHNID_API_PASSWORD=dummy-arachnid-password-SENTINEL \
            -e COMMUNITY_NODE_VLM_API_BASE_URL=http://vlm.smoke.invalid:8000 \
            -e COMMUNITY_NODE_VLM_MODEL=dummy-org/dummy-model \
            -e COMMUNITY_NODE_VLM_API_KEY=dummy-vlm-key-SENTINEL \
            -e COMMUNITY_NODE_SAFETY_EMIT_SIGNED_EVENTS=false \
            -e COMMUNITY_NODE_SAFETY_ISSUER_NODE_ID=smoke-issuer

          # mock は production image で構造的に選択不能（unknown provider として fail-closed）。
          run_case "mock rejected" fail 'unknown safety provider `mock`' \
            -e COMMUNITY_NODE_SAFETY_PROVIDER_KNOWN_CSAM=mock

          # 未知 provider 名は fail-closed で起動失敗。
          run_case "unknown provider rejected" fail "unknown safety provider" \
            -e COMMUNITY_NODE_SAFETY_PROVIDER_KNOWN_CSAM=no-such-provider

          # slot 制約: VLM は general / unknown_csam のみ、Arachnid は known_csam のみ。
          run_case "vlm rejected on known_csam slot" fail 'only supports the `general` / `unknown_csam` slots' \
            -e COMMUNITY_NODE_SAFETY_PROVIDER_KNOWN_CSAM=openai-compatible-vlm
          run_case "arachnid rejected on general slot" fail 'only supports the `known_csam` slot' \
            -e COMMUNITY_NODE_SAFETY_PROVIDER_GENERAL=project-arachnid-shield

          # credential / endpoint / 署名鍵の欠落は env 名を明示して起動失敗。
          run_case "missing arachnid credentials" fail "PROJECT_ARACHNID_API_USERNAME" \
            -e COMMUNITY_NODE_SAFETY_PROVIDER_KNOWN_CSAM=project-arachnid-shield
          run_case "missing vlm endpoint" fail "COMMUNITY_NODE_VLM_API_BASE_URL" \
            -e COMMUNITY_NODE_SAFETY_PROVIDER_GENERAL=openai-compatible-vlm
          run_case "missing signing key" fail "no signing key is configured" \
            -e COMMUNITY_NODE_SAFETY_PROVIDER_KNOWN_CSAM=project-arachnid-shield \
            -e PROJECT_ARACHNID_API_USERNAME=dummy-arachnid-user-SENTINEL \
            -e PROJECT_ARACHNID_API_PASSWORD=dummy-arachnid-password-SENTINEL

          # どのケースでも credential 値（SENTINEL 付きダミー値）が出力へ漏れないこと。
          if grep -qF "SENTINEL" <<<"$leak_log"; then
            echo "::error::a credential value leaked into the smoke output"
            exit 1
          fi
          echo "credential leak check: ok"

      - name: Login to GHCR
        if: ${{ steps.meta.outputs.push == 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # #1122: smoke が通った image だけを GHCR へ出す。build し直さず、書き出した
      # OCI layout の manifest（attestation を含む）をそのまま push する。
      - name: Push images
        if: ${{ steps.meta.outputs.push == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          for image in kukuri-cn-user-api kukuri-cn-iroh-relay kukuri-cn-cli kukuri-cn-indexer; do
            layout="${RUNNER_TEMP}/cn-images-out/${image}"
            digest=$(jq -r '.manifests[0].digest' "${layout}/index.json")
            if [[ -z "$digest" || "$digest" == "null" ]]; then
              echo "::error::${image}: OCI layout の digest を読めない"
              exit 1
            fi
            tag_args=()
            while read -r tag; do
              [[ -n "$tag" ]] && tag_args+=(--tag "$tag")
            done < "${RUNNER_TEMP}/cn-image-tags/${image}"
            echo "pushing ${image} (${digest}) -> ${tag_args[*]}"
            docker buildx imagetools create "${tag_args[@]}" "oci-layout://${layout}@${digest}"
          done

      - name: Image summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo "Push: ${{ steps.meta.outputs.push }}"
          for image in kukuri-cn-user-api kukuri-cn-iroh-relay kukuri-cn-cli kukuri-cn-indexer; do
            echo "Image: ${image}"
            sed 's/^/  tag: /' "${RUNNER_TEMP}/cn-image-tags/${image}" || true
          done
