name: Kukuri Flake Probe

# #1121: test の並列度を上げる変更の前後で、同じ suite を繰り返し実行して失敗率を測る。
# 手動起動のみ。lane ごとに 2 shard を並行させ、各 shard が `repeats` 回だけ suite を回す
# （既定は 2 shard × 10 回 = 20 回）。失敗しても最後まで回し、失敗回数を要約に出す。
# Cache Volume は通常の CI と別 tag を使い、本番の cache を上書きしない。

on:
  workflow_dispatch:
    inputs:
      lane:
        description: 'Suite to probe'
        required: true
        default: all
        type: choice
        options:
          - all
          - rust
          - vitest
          - playwright
      repeats:
        description: 'Iterations per shard (2 shards run in parallel)'
        required: false
        default: '10'
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  rust:
    if: ${{ inputs.lane == 'all' || inputs.lane == 'rust' }}
    runs-on: namespace-profile-kukuri;overrides.cache-tag=kukuri-probe-rust
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.92
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0

      - name: Install Linux system dependencies
        run: >
          sudo apt-get update &&
          sudo apt-get install -y
          pkg-config
          libdbus-1-dev
          libglib2.0-dev
          libgtk-3-dev
          libwebkit2gtk-4.1-dev
          libayatana-appindicator3-dev
          librsvg2-dev
          patchelf

      - name: Cache Rust
        uses: namespacelabs/nscloud-cache-action@v1
        with:
          cache: rust

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: Repeat rust-test
        env:
          KUKURI_PROBE_REPEATS: ${{ inputs.repeats }}
          KUKURI_PROBE_LABEL: rust (shard ${{ matrix.shard }})
        run: bash scripts/ci/flake_probe.sh cargo xtask-lite rust-test

      - name: Prune workspace build artifacts
        if: always()
        run: cargo xtask-lite ci-prune-target

  vitest:
    if: ${{ inputs.lane == 'all' || inputs.lane == 'vitest' }}
    runs-on: namespace-profile-kukuri-4v;overrides.cache-tag=kukuri-probe-desktop
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.92
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.16.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Cache Rust
        uses: namespacelabs/nscloud-cache-action@v1
        with:
          cache: rust

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      - name: Repeat desktop-test
        env:
          KUKURI_PROBE_REPEATS: ${{ inputs.repeats }}
          KUKURI_PROBE_LABEL: vitest (shard ${{ matrix.shard }})
        run: bash scripts/ci/flake_probe.sh cargo xtask-lite desktop-test

      - name: Prune workspace build artifacts
        if: always()
        run: cargo xtask-lite ci-prune-target

  playwright:
    if: ${{ inputs.lane == 'all' || inputs.lane == 'playwright' }}
    runs-on: namespace-profile-kukuri-4v;overrides.cache-tag=kukuri-probe-desktop
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.92
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0

      - name: Install Linux system dependencies
        run: >
          sudo apt-get update &&
          sudo apt-get install -y
          pkg-config
          libdbus-1-dev
          libglib2.0-dev
          libgtk-3-dev
          libwebkit2gtk-4.1-dev
          libayatana-appindicator3-dev
          librsvg2-dev
          patchelf

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.16.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Cache Rust
        uses: namespacelabs/nscloud-cache-action@v1
        with:
          cache: rust

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        working-directory: apps/desktop
        run: pnpm exec playwright install chromium

      - name: Repeat desktop-browser-test
        env:
          KUKURI_PROBE_REPEATS: ${{ inputs.repeats }}
          KUKURI_PROBE_LABEL: playwright (shard ${{ matrix.shard }})
        run: bash scripts/ci/flake_probe.sh cargo xtask-lite desktop-browser-test

      - name: Prune workspace build artifacts
        if: always()
        run: cargo xtask-lite ci-prune-target
