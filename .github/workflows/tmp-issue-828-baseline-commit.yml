# Issue #828 専用の一時workflow。kukuri-visual-baseline.yml と同じ環境で
# baseline を生成し、light theme の3枚だけを branch へ commit する。
# artifact の外部downloadが実行環境のegress policyで塞がれているための代替。
# baseline commit 後にこのfileは削除する。
name: tmp-issue-828-baseline-commit

# workflow_dispatchはdefault branch上のworkflowしか受け付けないため、
# このbranchへのpushで起動する。GITHUB_TOKENによるbaseline commitのpushは
# workflowを再起動しない(GitHubの再帰防止)。
on:
  push:
    branches:
      - claude/issue-828-plan-x5ull7

permissions:
  contents: write

jobs:
  commit-light-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.16.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        working-directory: apps/desktop
        run: pnpm exec playwright install chromium

      - name: Regenerate visual baseline
        working-directory: apps/desktop
        run: pnpm test:e2e:visual --update-snapshots=all

      - name: Commit light baselines only
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/desktop/tests/playwright/__screenshots__/visual.spec.ts/timeline-wide-light.png \
            apps/desktop/tests/playwright/__screenshots__/visual.spec.ts/timeline-narrow-light.png \
            apps/desktop/tests/playwright/__screenshots__/visual.spec.ts/settings-appearance-wide-light.png
          git checkout -- apps/desktop/tests/playwright/__screenshots__/
          if git diff --cached --quiet; then
            echo "light baselines unchanged; nothing to commit"
          else
            git commit -m "test(desktop): Issue #828のlight visual baselineをCIで再生成"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
