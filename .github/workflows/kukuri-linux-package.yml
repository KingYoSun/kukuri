name: Kukuri Linux Package

on:
  pull_request:
    paths:
      - '.github/workflows/kukuri-linux-package.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'xtask/**'
      - 'crates/**'
      - 'apps/desktop/**'
      - 'scripts/release/*appimage_runtime_inventory.py'
      - 'scripts/release/release_assets.py'
      - 'scripts/release/native*'
      - 'scripts/release/test_native_compliance.py'
  workflow_call:
    inputs:
      source_ref:
        type: string
        required: true
      signing:
        type: string
        default: distribution
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: true
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false
      TAURI_UPDATER_PUBLIC_KEY:
        required: true
  workflow_dispatch:
    inputs:
      signing:
        description: '署名用途。testは一時鍵、distributionは設定済み配布鍵を使用（公開はしない）'
        type: choice
        options: [test, distribution]
        default: test

permissions:
  contents: read

jobs:
  linux-appimage:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - name: Verify requested source
        env:
          REQUESTED_SOURCE: ${{ inputs.source_ref }}
        run: |
          if [ -n "$REQUESTED_SOURCE" ]; then
            [[ "$REQUESTED_SOURCE" =~ ^[0-9a-f]{40}$ ]] && test "$(git rev-parse HEAD)" = "$REQUESTED_SOURCE"
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0
      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libdbus-1-dev libglib2.0-dev libgtk-3-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            libfuse2 file desktop-file-utils dbus binutils python3
      - uses: pnpm/action-setup@v4
        with:
          version: 10.16.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: kukuri-linux-package
          workspaces: |
            . -> target
            apps/desktop/src-tauri -> target
      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile
      - name: Package contracts
        run: |
          cargo test --locked -p xtask
          python3 scripts/release/test_appimage_runtime_inventory.py
          python3 scripts/release/test_native_compliance.py
      - name: Build and verify AppImage
        env:
          # PRでは本番secretを環境へ渡さない。
          TAURI_SIGNING_PRIVATE_KEY: ${{ (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))) && inputs.signing == 'distribution' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))) && inputs.signing == 'distribution' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))) && inputs.signing == 'distribution' && secrets.TAURI_UPDATER_PUBLIC_KEY || '' }}
          SIGNING_MODE: ${{ (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))) && inputs.signing == 'distribution' && 'distribution' || 'test' }}
        shell: bash
        run: |
          set -euo pipefail
          key_dir=$(mktemp -d)
          trap 'rm -f "$key_dir/key"' EXIT
          if [ "$SIGNING_MODE" = test ]; then
            node apps/desktop/node_modules/@tauri-apps/cli/tauri.js signer generate \
              --ci --write-keys "$key_dir/key" >/dev/null 2>&1
            export TAURI_SIGNING_PRIVATE_KEY="$key_dir/key"
            export TAURI_SIGNING_PRIVATE_KEY_PASSWORD=''
            export TAURI_UPDATER_PUBLIC_KEY="$(< "$key_dir/key.pub")"
          else
            test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo '配布用秘密鍵がありません' >&2; exit 1; }
            test -n "$TAURI_UPDATER_PUBLIC_KEY" || { echo '配布用公開鍵がありません' >&2; exit 1; }
          fi
          node --input-type=module -e '
            import fs from "node:fs";
            const file = "apps/desktop/src-tauri/tauri.conf.json";
            const config = JSON.parse(fs.readFileSync(file, "utf8"));
            config.plugins.updater.pubkey = process.env.TAURI_UPDATER_PUBLIC_KEY.trim();
            fs.writeFileSync(file, JSON.stringify(config, null, 2));
          '
          cargo xtask desktop-package
          bundle=apps/desktop/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage
          bash xtask/tests/appimage/gio-isolation.sh "$bundle/kukuri.AppDir"
          printf '%s\n' "$TAURI_UPDATER_PUBLIC_KEY" > "$bundle/test-updater-key.pub"
          KUKURI_APPIMAGE_TEST_DIR="$PWD/$bundle" cargo test --locked -p xtask \
            appimage::tests::signed_appimage_accepts_only_matching_bundle_and_key -- --ignored
          printf '%s\n' "$SIGNING_MODE" > "$bundle/signing-mode.txt"
          git rev-parse HEAD > "$bundle/source-commit.txt"
          desktop-file-validate "$bundle/kukuri.AppDir/usr/share/applications/kukuri.desktop"
          export KUKURI_PACKAGE_BUNDLE_DIR="$bundle"
          node --input-type=module -e '
            import fs from "node:fs";
            import path from "node:path";
            const source = process.env.KUKURI_PACKAGE_BUNDLE_DIR;
            const output = path.join(process.env.RUNNER_TEMP, "kukuri-linux-package");
            fs.mkdirSync(output);
            const metadata = JSON.parse(fs.readFileSync(path.join(source, "appimage-artifacts.json"), "utf8"));
            for (const name of [metadata.file, metadata.signature_file, "appimage-artifacts.json", "test-updater-key.pub", "signing-mode.txt", "source-commit.txt"]) {
              fs.copyFileSync(path.join(source, name), path.join(output, name));
            }
          '
          python3 scripts/release/appimage_runtime_inventory.py \
            "$bundle/kukuri.AppDir" "$RUNNER_TEMP/kukuri-linux-package/runtime-evidence"
          output="$RUNNER_TEMP/kukuri-linux-package"
          version=$(python3 -c 'import json,os; print(json.load(open(os.environ["KUKURI_PACKAGE_BUNDLE_DIR"]+"/appimage-artifacts.json"))["version"])')
          filename=$(python3 -c 'import json,os; print(json.load(open(os.environ["KUKURI_PACKAGE_BUNDLE_DIR"]+"/appimage-artifacts.json"))["file"])')
          cp "$output/test-updater-key.pub" "$output/linux-x86_64-updater-key.pub"
          notices="kukuri_${version}_linux-native-notices.tar.gz"
          tar -czf "$output/$notices" -C "$output" runtime-evidence
          python3 scripts/release/release_assets.py package --directory "$output" --target linux-x86_64 \
            --version "$version" --source "$(git rev-parse HEAD)" --signing "$SIGNING_MODE" \
            --updater "$filename" --public-key-file linux-x86_64-updater-key.pub \
            --file "$filename" --file "$filename.sig" --file linux-x86_64-updater-key.pub --file "$notices"
      - name: Collect corresponding native sources for distribution
        if: ${{ (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))) && inputs.signing == 'distribution' }}
        run: |
          set -euo pipefail
          # This changes only the disposable build runner, never a user's OS.
          sed -n 's/^deb /deb-src /p' /etc/apt/sources.list | sudo tee /etc/apt/sources.list.d/kukuri-source.list >/dev/null
          sudo apt-get update
          python3 scripts/release/native_compliance.py --package "$RUNNER_TEMP/kukuri-linux-package" \
            --appdir apps/desktop/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/kukuri.AppDir
      - name: Linux desktop contracts (isolated notification bus)
        run: >-
          cargo test --locked --release --target x86_64-unknown-linux-gnu
          --manifest-path apps/desktop/src-tauri/Cargo.toml --lib
      - name: Real updater replacement failure and explicit retry
        shell: bash
        run: |
          set -euo pipefail
          bundle_dir="$PWD/apps/desktop/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage"
          bundles=("$bundle_dir"/*.AppImage)
          test "${#bundles[@]}" -eq 1
          export KUKURI_UPDATER_BUNDLE="${bundles[0]}"
          export KUKURI_UPDATER_SIGNATURE="${bundles[0]}.sig"
          export KUKURI_UPDATER_PUBLIC_KEY_FILE="$bundle_dir/test-updater-key.pub"
          cargo test --locked --release --target x86_64-unknown-linux-gnu \
            --manifest-path apps/desktop/src-tauri/Cargo.toml --test updater_install -- --ignored
      - name: Keep verified artifacts (no Release publication)
        uses: actions/upload-artifact@v4
        with:
          name: kukuri-linux-x86_64-${{ (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))) && inputs.signing == 'distribution' && 'distribution' || 'test' }}
          if-no-files-found: error
          path: ${{ runner.temp }}/kukuri-linux-package/
