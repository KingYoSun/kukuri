name: Kukuri Nightly

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # #1120: CI の dev / test build は行番号だけの debuginfo にし、link 時間と Cache Volume の容量を減らす。
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

# #1120: cache-tag の `-v2` は、debuginfo を line-tables-only にする前の依存 crate の成果物を含む
# 旧 volume を捨てるために付けた。依存の build 設定を大きく変えたときは同じ方法で入れ替える。
jobs:
  linux-app-api-slow:
    runs-on: namespace-profile-kukuri;overrides.cache-tag=kukuri-app-api-slow
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.92
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0

      - name: Cache Rust
        uses: namespacelabs/nscloud-cache-action@v1
        with:
          cache: rust

      - name: App API slow iroh integration tests
        run: cargo xtask-lite app-api-slow-test

      # #1120: workspace crate の成果物は checkout ごとに再 compile されるため、Cache Volume に残さない。
      - name: Prune workspace build artifacts
        run: cargo xtask-lite ci-prune-target

  linux-additional-scenarios:
    runs-on: namespace-profile-kukuri-4v;overrides.cache-tag=kukuri-harness-v2
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - desktop_smoke_bookmark_workflow
          - desktop_smoke_game_room_persist
          - desktop_smoke_metaverse_dome_delete
          - desktop_smoke_live_session_persist
          - pairwise_dm_offline_text_image_video_delivery_and_local_delete
          - private_channel_invite_connectivity
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.92
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0

      - name: Install Linux system dependencies
        run: >
          sudo apt-get update &&
          sudo apt-get install -y
          pkg-config
          libdbus-1-dev
          libglib2.0-dev
          libgtk-3-dev
          libwebkit2gtk-4.1-dev
          libayatana-appindicator3-dev
          librsvg2-dev
          patchelf

      - name: Cache Rust
        uses: namespacelabs/nscloud-cache-action@v1
        with:
          cache: rust

      - name: Run scenario
        run: cargo xtask scenario ${{ matrix.scenario }}

      - name: Upload scenario artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kukuri-nightly-${{ matrix.scenario }}-artifacts
          path: test-results/kukuri/
          if-no-files-found: warn

      # #1120: workspace crate の成果物は checkout ごとに再 compile されるため、Cache Volume に残さない。
      - name: Prune workspace build artifacts
        run: cargo xtask ci-prune-target

  linux-rust-static:
    runs-on: namespace-profile-kukuri;overrides.cache-tag=kukuri-rust-static-v2
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.92
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0
          components: clippy,rustfmt

      - name: Install Linux system dependencies
        run: >
          sudo apt-get update &&
          sudo apt-get install -y
          pkg-config
          libdbus-1-dev
          libglib2.0-dev
          libgtk-3-dev
          libwebkit2gtk-4.1-dev
          libayatana-appindicator3-dev
          librsvg2-dev
          patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache Rust
        uses: namespacelabs/nscloud-cache-action@v1
        with:
          cache: rust

      - name: Doctor
        run: cargo xtask-lite doctor

      - name: Oversized file report
        run: cargo xtask-lite oversized-files

      - name: Rust checks
        run: cargo xtask-lite rust-check

      - name: Tauri compile check
        run: cargo xtask-lite tauri-check

      # #1120: workspace crate の成果物は checkout ごとに再 compile されるため、Cache Volume に残さない。
      - name: Prune workspace build artifacts
        run: cargo xtask-lite ci-prune-target

  linux-rust-tests:
    runs-on: namespace-profile-kukuri;overrides.cache-tag=kukuri-rust-tests-v2
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.92
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0

      - name: Install Linux system dependencies
        run: >
          sudo apt-get update &&
          sudo apt-get install -y
          pkg-config
          libdbus-1-dev
          libglib2.0-dev
          libgtk-3-dev
          libwebkit2gtk-4.1-dev
          libayatana-appindicator3-dev
          librsvg2-dev
          patchelf

      - name: Cache Rust
        uses: namespacelabs/nscloud-cache-action@v1
        with:
          cache: rust

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: Rust tests
        run: cargo xtask-lite rust-test

      # #1120: workspace crate の成果物は checkout ごとに再 compile されるため、Cache Volume に残さない。
      - name: Prune workspace build artifacts
        run: cargo xtask-lite ci-prune-target

  linux-desktop-ui:
    runs-on: namespace-profile-kukuri-4v;overrides.cache-tag=kukuri-desktop
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.92
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0

      - name: Install Linux system dependencies
        run: >
          sudo apt-get update &&
          sudo apt-get install -y
          pkg-config
          libdbus-1-dev
          libglib2.0-dev
          libgtk-3-dev
          libwebkit2gtk-4.1-dev
          libayatana-appindicator3-dev
          librsvg2-dev
          patchelf

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.16.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Cache Rust
        uses: namespacelabs/nscloud-cache-action@v1
        with:
          cache: rust

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      - name: Desktop lint + typecheck
        run: cargo xtask-lite desktop-lint

      - name: Desktop Vitest
        run: cargo xtask-lite desktop-test

      # #1120: workspace crate の成果物は checkout ごとに再 compile されるため、Cache Volume に残さない。
      - name: Prune workspace build artifacts
        run: cargo xtask-lite ci-prune-target

  linux-desktop-browser:
    # #1121: Playwright は CPU を使い切るため 8 vCPU で動かす（fast と同じ理由）。
    runs-on: namespace-profile-kukuri;overrides.cache-tag=kukuri-desktop
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.92
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0

      - name: Install Linux system dependencies
        run: >
          sudo apt-get update &&
          sudo apt-get install -y
          pkg-config
          libdbus-1-dev
          libglib2.0-dev
          libgtk-3-dev
          libwebkit2gtk-4.1-dev
          libayatana-appindicator3-dev
          librsvg2-dev
          patchelf

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.16.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Cache Rust
        uses: namespacelabs/nscloud-cache-action@v1
        with:
          cache: rust

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        working-directory: apps/desktop
        run: pnpm exec playwright install chromium

      - name: Desktop Storybook build
        run: cargo xtask-lite desktop-storybook

      - name: Desktop browser tests
        run: cargo xtask-lite desktop-browser-test

      # #1120: workspace crate の成果物は checkout ごとに再 compile されるため、Cache Volume に残さない。
      - name: Prune workspace build artifacts
        run: cargo xtask-lite ci-prune-target

  linux-cn:
    runs-on: namespace-profile-kukuri;overrides.cache-tag=kukuri-cn-v2
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.92
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0

      - name: Install Linux system dependencies
        run: >
          sudo apt-get update &&
          sudo apt-get install -y
          pkg-config
          ffmpeg
          libdbus-1-dev
          libglib2.0-dev
          libgtk-3-dev
          libwebkit2gtk-4.1-dev
          libayatana-appindicator3-dev
          librsvg2-dev
          patchelf

      - name: Cache Rust
        uses: namespacelabs/nscloud-cache-action@v1
        with:
          cache: rust

      - name: Community-node checks
        run: cargo xtask-lite cn-check

      - name: Community-node integration tests
        run: cargo xtask-lite cn-test

      # #1120: workspace crate の成果物は checkout ごとに再 compile されるため、Cache Volume に残さない。
      - name: Prune workspace build artifacts
        run: cargo xtask-lite ci-prune-target

  linux-smoke:
    runs-on: namespace-profile-kukuri-4v;overrides.cache-tag=kukuri-harness-v2
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.92
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0

      - name: Install Linux system dependencies
        run: >
          sudo apt-get update &&
          sudo apt-get install -y
          pkg-config
          libdbus-1-dev
          libglib2.0-dev
          libgtk-3-dev
          libwebkit2gtk-4.1-dev
          libayatana-appindicator3-dev
          librsvg2-dev
          patchelf

      - name: Cache Rust
        uses: namespacelabs/nscloud-cache-action@v1
        with:
          cache: rust

      - name: E2E smoke
        run: cargo xtask e2e-smoke

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kukuri-nightly-smoke-artifacts
          path: test-results/kukuri/
          if-no-files-found: warn

      # #1120: workspace crate の成果物は checkout ごとに再 compile されるため、Cache Volume に残さない。
      - name: Prune workspace build artifacts
        run: cargo xtask ci-prune-target

  linux-community-node:
    runs-on: namespace-profile-kukuri-4v;overrides.cache-tag=kukuri-harness-v2
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.92
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0

      - name: Install Linux system dependencies
        run: >
          sudo apt-get update &&
          sudo apt-get install -y
          pkg-config
          libdbus-1-dev
          libglib2.0-dev
          libgtk-3-dev
          libwebkit2gtk-4.1-dev
          libayatana-appindicator3-dev
          librsvg2-dev
          patchelf

      - name: Cache Rust
        uses: namespacelabs/nscloud-cache-action@v1
        with:
          cache: rust

      - name: Community-node connectivity scenario
        env:
          CN_POSTGRES_PORT: "55433"
          COMMUNITY_NODE_DATABASE_URL: postgres://cn:cn_password@127.0.0.1:55433/cn
        run: cargo xtask scenario community_node_public_connectivity

      - name: Upload community-node artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kukuri-nightly-community-node-artifacts
          path: test-results/kukuri/
          if-no-files-found: warn

      # #1120: workspace crate の成果物は checkout ごとに再 compile されるため、Cache Volume に残さない。
      - name: Prune workspace build artifacts
        run: cargo xtask ci-prune-target

  linux-community-node-multi-device:
    runs-on: namespace-profile-kukuri-4v;overrides.cache-tag=kukuri-harness-v2
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.92
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0

      - name: Install Linux system dependencies
        run: >
          sudo apt-get update &&
          sudo apt-get install -y
          pkg-config
          libdbus-1-dev
          libglib2.0-dev
          libgtk-3-dev
          libwebkit2gtk-4.1-dev
          libayatana-appindicator3-dev
          librsvg2-dev
          patchelf

      - name: Cache Rust
        uses: namespacelabs/nscloud-cache-action@v1
        with:
          cache: rust

      - name: Community-node multi-device scenario
        env:
          CN_POSTGRES_PORT: "55434"
          COMMUNITY_NODE_DATABASE_URL: postgres://cn:cn_password@127.0.0.1:55434/cn
        run: cargo xtask scenario community_node_multi_device_connectivity

      - name: Upload multi-device artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kukuri-nightly-community-node-multi-device-artifacts
          path: test-results/kukuri/
          if-no-files-found: warn

      # #1120: workspace crate の成果物は checkout ごとに再 compile されるため、Cache Volume に残さない。
      - name: Prune workspace build artifacts
        run: cargo xtask ci-prune-target
