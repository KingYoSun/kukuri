name: Temporary Visual Baseline Commit (#962)

# #962 の作業ブランチ専用の一時 workflow。この実行環境では Actions artifact の
# 取得先(Azure blob)へ到達できないため、kukuri-visual-baseline.yml と同じ手順で
# baseline を生成し、そのまま作業ブランチへ commit する。baseline 取り込み後に削除する。
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        run: >
          sudo apt-get update &&
          sudo apt-get install -y
          pkg-config
          libdbus-1-dev
          libglib2.0-dev
          libgtk-3-dev
          libwebkit2gtk-4.1-dev
          libayatana-appindicator3-dev
          librsvg2-dev
          patchelf
          fonts-noto-cjk

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.16.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        working-directory: apps/desktop
        run: pnpm exec playwright install chromium

      - name: Generate visual baseline
        working-directory: apps/desktop
        run: pnpm test:e2e:visual --update-snapshots

      - name: Commit and push baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/tests/playwright/__screenshots__
          if git diff --cached --quiet; then
            echo "baseline unchanged"
            exit 0
          fi
          git commit -m "test(desktop): 視覚 baseline を Linux/Chromium で再生成 (#962)"
          git push
