# actionlint が runs-on の label を検査するための設定。
# Namespace の runner profile（#1073）。Linux job は `;overrides.cache-tag=<tag>` で
# Cache Volume を分けるため、label はパターンで登録する。
self-hosted-runner:
  labels:
    - namespace-profile-kukuri
    - namespace-profile-kukuri;overrides.cache-tag=*
    - namespace-profile-kukuri-win
    - namespace-profile-kukuri-win;overrides.cache-tag=*
    - namespace-profile-kukuri-4v;overrides.cache-tag=*
    - namespace-profile-kukuri-cn-images
    # Ubuntu 22.04、Cache Volume なし。配布物を build する release 用（#1180）。
    - namespace-profile-kukuri-linux-release
